name: NexiMail CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: neximail
          POSTGRES_USER: neximail
          POSTGRES_PASSWORD: neximail
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U neximail -d neximail"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgres://neximail:neximail@localhost:5432/neximail
      REDIS_URL: redis://localhost:6379
      POSTGRES_PASSWORD: neximail
      AUTH_SECRET: ci-only-auth-secret-value-that-is-at-least-32-characters
      PUBLIC_TOKEN_SECRET: ci-only-public-token-secret-that-is-at-least-32-characters
      WEBHOOK_SECRET_KEY: ci-only-webhook-secret-value-that-is-at-least-32-characters
      DKIM_SECRET_KEY: ci-only-dkim-secret-value-that-is-at-least-32-characters
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run db:migrate
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare compose environment
        run: cp .env.example .env
      - name: Validate production compose
        run: docker compose -f docker-compose.prod.yml config >/dev/null
      - name: Build mail transport image
        run: docker build -f Dockerfile.mta -t neximail-mta:ci .
      - name: Smoke test mail transport runtime
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p neximail-ci -f docker-compose.prod.yml up -d mta
          for i in $(seq 1 20); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$(docker compose -p neximail-ci -f docker-compose.prod.yml ps -q mta)")"
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ] || [ "$status" = exited ]; then
              docker compose -p neximail-ci -f docker-compose.prod.yml logs mta
              exit 1
            fi
            sleep 2
          done
          docker compose -p neximail-ci -f docker-compose.prod.yml exec -T mta postfix status
          docker compose -p neximail-ci -f docker-compose.prod.yml exec -T mta sh -lc 'test -s /run/opendkim/opendkim.pid && kill -0 "$(cat /run/opendkim/opendkim.pid)"'
          docker compose -p neximail-ci -f docker-compose.prod.yml exec -T mta sh -c 'echo persisted > /var/spool/postfix/.neximail-ci'
          docker compose -p neximail-ci -f docker-compose.prod.yml up -d --no-deps --force-recreate --wait --wait-timeout 60 mta
          docker compose -p neximail-ci -f docker-compose.prod.yml exec -T mta sh -c 'test "$(cat /var/spool/postfix/.neximail-ci)" = persisted && rm /var/spool/postfix/.neximail-ci'
          docker compose -p neximail-ci -f docker-compose.prod.yml down -v
