x-runtime: &runtime
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-neximail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neximail}
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neximail}
      POSTGRES_USER: ${POSTGRES_USER:-neximail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neximail} -d ${POSTGRES_DB:-neximail}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    <<: *runtime
    ports:
      - "127.0.0.1:3000:3000"

  campaign-worker:
    <<: *runtime
    command: ["npm", "run", "worker:campaign"]

  policy-worker:
    <<: *runtime
    command: ["npm", "run", "worker:policy"]

  event-worker:
    <<: *runtime
    command: ["npm", "run", "worker:event"]

  validation-worker:
    <<: *runtime
    command: ["npm", "run", "worker:validation"]

  domain-health-worker:
    <<: *runtime
    command: ["npm", "run", "worker:domain-health"]

  reputation-worker:
    <<: *runtime
    command: ["npm", "run", "worker:reputation"]

# transport-worker and postfix-event-worker intentionally run on the VPS host
# using deploy/systemd/neximail-worker@.service so they can access the local
# Postfix sendmail binary and mail logs without exposing the MTA to containers.

volumes:
  postgres_data:
  redis_data:
